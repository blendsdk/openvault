server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fluent UI's Griffel runtime injects style elements. Scripts stay
    # same-origin and there is no eval. The API keeps its stricter CSP.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain; charset=utf-8" always;
        return 200 "ok\n";
    }

    # Vite emits content-hashed file names. A one-year immutable cache is safe.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The SPA shell must be revalidated so a new deploy is picked up.
    location = /index.html {
        expires -1;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
