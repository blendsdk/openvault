name: openvault-test

services:
  postgres16:
    image: postgres:16-alpine
    profiles: ["pg16"]
    environment:
      POSTGRES_DB: openvault_test
      POSTGRES_USER: openvault
      POSTGRES_PASSWORD: test-password
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openvault -d openvault_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  postgres17:
    image: postgres:17-alpine
    profiles: ["pg17"]
    environment:
      POSTGRES_DB: openvault_test
      POSTGRES_USER: openvault
      POSTGRES_PASSWORD: test-password
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openvault -d openvault_test"]
      interval: 2s
      timeout: 3s
      retries: 20
