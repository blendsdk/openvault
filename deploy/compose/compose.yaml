name: openvault

services:
  proxy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - openvault_ca_public:/etc/openvault/ca:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge_net: {}
      admin_net:
        ipv4_address: 172.30.0.2
    depends_on:
      openvaultd:
        condition: service_healthy

  openvault-init:
    # Runs once to create the keyring, CA, server certificate, and bootstrap admin.
    image: ghcr.io/blendsdk/openvault:0.1.0
    command: ["ov", "init", "--prepare"]
    environment:
      OPENVAULT_DB_URL: postgres://openvault:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/openvault
      OPENVAULT_KEYRING: /var/lib/openvault/keyring.json
      OPENVAULT_TLS_CERT: /etc/openvault/tls/server.crt
      OPENVAULT_TLS_KEY: /etc/openvault/tls/server.key
      # The provisioner publishes only the CA certificate here for the proxy.
      OPENVAULT_CA_PUBLIC_DIR: /etc/openvault/ca
    volumes:
      - openvault_data:/var/lib/openvault
      - openvault_tls:/etc/openvault/tls
      - openvault_ca_public:/etc/openvault/ca
    networks:
      - db_net
    depends_on:
      postgres:
        condition: service_healthy

  openvaultd:
    # v0.1 target image. Until the release exists, build or pull the local image.
    image: ghcr.io/blendsdk/openvault:0.1.0
    environment:
      OPENVAULT_BASE_URL: ${OPENVAULT_BASE_URL:-https://localhost}
      OPENVAULT_DB_URL: postgres://openvault:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/openvault
      OPENVAULT_KEYRING: /var/lib/openvault/keyring.json
      OPENVAULT_TLS_CERT: /etc/openvault/tls/server.crt
      OPENVAULT_TLS_KEY: /etc/openvault/tls/server.key
      OPENVAULT_INTERNAL_CA: /etc/openvault/tls/ca.pem
      OPENVAULT_ADMIN_PORT: "8443"
      OPENVAULT_AGENT_PORT: "8444"
      OPENVAULT_TRUST_PROXY: "true"
      OPENVAULT_PROXY_CIDRS: 172.30.0.2/32
      OPENVAULT_LOG_LEVEL: info
    volumes:
      - openvault_data:/var/lib/openvault:ro
      - openvault_tls:/etc/openvault/tls:ro
    networks:
      admin_net:
        ipv4_address: 172.30.0.3
      vault_net: {}
      db_net: {}
    healthcheck:
      test:
        ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:8443/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      openvault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openvault
      POSTGRES_USER: openvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openvault -d openvault"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  edge_net: {}
  admin_net:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  vault_net:
    name: vault_net
    internal: true
  db_net:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  openvault_data:
  openvault_tls:
  openvault_ca_public:
